<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isa 💙</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.30), transparent 35%),
        linear-gradient(135deg, #eff6ff, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
      overflow: hidden;
    }

    .decoracao {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bolinha {
      position: absolute;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.18);
      animation: flutuar 8s ease-in-out infinite;
    }

    .bolinha:nth-child(1) {
      width: 180px;
      height: 180px;
      top: 8%;
      left: 8%;
    }

    .bolinha:nth-child(2) {
      width: 120px;
      height: 120px;
      right: 12%;
      top: 18%;
      animation-delay: 1.5s;
    }

    .bolinha:nth-child(3) {
      width: 150px;
      height: 150px;
      bottom: 10%;
      right: 8%;
      animation-delay: 3s;
    }

    .bolinha:nth-child(4) {
      width: 80px;
      height: 80px;
      left: 18%;
      bottom: 18%;
      animation-delay: 2s;
    }

    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-22px);
      }
    }

    .card {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(147, 197, 253, 0.65);
      border-radius: 32px;
      box-shadow: 0 24px 80px rgba(37, 99, 235, 0.18);
      padding: 44px 34px;
      text-align: center;
      animation: entrada 0.8s ease;
    }

    @keyframes entrada {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    .foto-area {
      width: 170px;
      height: 170px;
      margin: 0 auto 22px;
      position: relative;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #60a5fa, #2563eb, #93c5fd);
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.28);
    }

    .foto-area::after {
      content: "💙";
      position: absolute;
      right: 4px;
      bottom: 12px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
      font-size: 22px;
    }

    .foto-area img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid white;
      background: #dbeafe;
    }

    .foto-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #dbeafe;
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      font-weight: 800;
      font-size: 15px;
      padding: 18px;
      text-align: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: "Pacifico", cursive;
      font-size: clamp(56px, 12vw, 92px);
      color: #2563eb;
      text-shadow: 0 8px 24px rgba(37, 99, 235, 0.22);
      line-height: 1.1;
    }

    .subtitulo {
      margin: 18px auto 0;
      max-width: 430px;
      font-size: 18px;
      line-height: 1.6;
      color: #334155;
    }

    .linha {
      width: 82px;
      height: 4px;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      border-radius: 999px;
      margin: 28px auto;
    }

    .mensagem {
      min-height: 72px;
      margin: 0 auto;
      max-width: 430px;
      color: #1e3a8a;
      font-size: 17px;
      line-height: 1.7;
      font-weight: 500;
    }

    .nomes {
      margin: 26px 0 8px;
      color: #2563eb;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 2;
    }

    button {
      margin-top: 24px;
      border: 0;
      outline: 0;
      border-radius: 999px;
      padding: 15px 30px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 16px 35px rgba(37, 99, 235, 0.28);
      transition: 0.22s ease;
    }

    button:hover {
      transform: translateY(-3px);
      background: #1d4ed8;
      box-shadow: 0 20px 45px rgba(37, 99, 235, 0.34);
    }

    #resposta {
      display: none;
      margin: 26px auto 0;
      max-width: 390px;
      padding: 18px;
      border-radius: 22px;
      color: #1e40af;
      background: #dbeafe;
      border: 1px solid #93c5fd;
      font-size: 21px;
      font-weight: 800;
      animation: aparecer 0.4s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .rodape {
      margin-top: 28px;
      color: #64748b;
      font-size: 14px;
    }

    .coracao {
      position: fixed;
      bottom: -40px;
      color: #2563eb;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
      animation: subir linear forwards;
    }

    @keyframes subir {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.75;
      }

      to {
        transform: translateY(-110vh) rotate(180deg);
        opacity: 0;
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 24px;
        border-radius: 26px;
      }

      .subtitulo,
      .mensagem {
        font-size: 16px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="decoracao">
    <span class="bolinha"></span>
    <span class="bolinha"></span>
    <span class="bolinha"></span>
    <span class="bolinha"></span>
  </div>

  <main class="card">

    <div class="foto-area">
      <!-- Troque "foto-isa.jpg" pelo nome da foto dela.
           Exemplo: coloque a imagem na mesma pasta do index.html e deixe src="foto-isa.jpg" -->
      <img src="https://beautiful-peach-g3wdjz9qqq.edgeone.app/IMG_4065.jpeg" alt="Foto da Isa" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="foto-placeholder" style="display: none;">coloque a foto dela aqui</div>
    </div>


    <h1>Isa</h1>

    <p class="subtitulo">
      So pra lembrar que tu é a mais mais.
    </p>

    <div class="linha"></div>

    <p class="mensagem" id="textoDigitado"></p>

    <div class="nomes">
      Isa 💙 Isa 💙 Isa<br>
    
    </div>

    <button onclick="mostrarMensagem()">clique aqui 💙</button>

    <div id="resposta">otaria kkkkkkkkkkk te gosto demaisss 💙</div>

    <div class="rodape">
      com carinho, do seu site azul favorito.
    </div>
  </main>

  <script>
    const texto = "Isa seTUUUUUUballl 💙";
    const areaTexto = document.getElementById("textoDigitado");
    let i = 0;

    function digitar() {
      if (i < texto.length) {
        areaTexto.textContent += texto.charAt(i);
        i++;
        setTimeout(digitar, 35);
      }
    }

    digitar();

    function mostrarMensagem() {
      document.getElementById("resposta").style.display = "block";
      soltarCoracoes(22);
    }

    function criarCoracao() {
      const coracao = document.createElement("div");
      const itens = ["💙", "🩵", "💎", "✨"];

      coracao.className = "coracao";
      coracao.textContent = itens[Math.floor(Math.random() * itens.length)];
      coracao.style.left = Math.random() * 100 + "vw";
      coracao.style.fontSize = (18 + Math.random() * 18) + "px";
      coracao.style.animationDuration = (5 + Math.random() * 4) + "s";

      document.body.appendChild(coracao);

      setTimeout(() => {
        coracao.remove();
      }, 9000);
    }

    function soltarCoracoes(qtd) {
      for (let j = 0; j < qtd; j++) {
        setTimeout(criarCoracao, j * 50);
      }
    }

    setInterval(criarCoracao, 900);
  </script>
</body>
</html>
