<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapunzel 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top, rgba(255,215,64,0.15), transparent 30%),
    linear-gradient(180deg,#1a1035,#2c145a,#4b1f7a);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.estrelas{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.estrela{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:piscar 2s infinite alternate;
}

@keyframes piscar{
    from{opacity:.2;}
    to{opacity:1;}
}

.card{
    width:90%;
    max-width:600px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:35px;
    padding:40px;
    text-align:center;
    position:relative;
    box-shadow:0 0 40px rgba(255,215,64,0.25);
}

.card::before{
    content:'✨';
    position:absolute;
    top:-18px;
    right:25px;
    font-size:40px;
}

.foto{
    width:180px;
    height:180px;
    margin:auto;
    border-radius:50%;
    padding:6px;
    background:linear-gradient(135deg,#ffd54f,#fff3b0,#d4a017);
    box-shadow:0 0 30px rgba(255,215,64,.6);
}

.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #fff;
}

h1{
    margin-top:25px;
    font-size:70px;
    color:#ffd54f;
    font-family:'Cinzel',serif;
    text-shadow:0 0 20px rgba(255,215,64,.7);
}

.sub{
    margin-top:15px;
    font-size:18px;
    color:#f3d9ff;
}

.linha{
    width:100px;
    height:4px;
    margin:25px auto;
    border-radius:999px;
    background:linear-gradient(to right,#ffd54f,#c084fc);
}

.texto{
    font-size:18px;
    line-height:1.8;
    color:#fff;
}

button{
    margin-top:30px;
    padding:16px 35px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#ffd54f,#ffca28);
    color:#4a148c;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 25px rgba(255,215,64,.5);
}

button:hover{
    transform:translateY(-4px) scale(1.03);
}

#mensagem{
    display:none;
    margin-top:25px;
    font-size:22px;
    color:#ffe082;
    animation:fade .5s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.lanterna{
    position:fixed;
    bottom:-100px;
    font-size:28px;
    animation:subir linear forwards;
    opacity:.85;
}

@keyframes subir{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

.rodape{
    margin-top:28px;
    color:#e9d5ff;
    font-size:14px;
}



.titulo-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

.titulo-area h1{
    margin-top:0;
}

.pascal-container{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.pascal{
    width:105px;
    animation:pascalFloat 3s ease-in-out infinite;
    cursor:pointer;
    user-select:none;
    filter:drop-shadow(0 0 12px rgba(0,0,0,.35));
}

.pascal:hover{
    transform:scale(1.06);
}

.pascal-fala{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    margin-bottom:8px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.25);
    color:white;
    padding:10px 13px;
    border-radius:16px;
    width:180px;
    font-size:12px;
    text-align:center;
    display:none;
    animation:fade .3s ease;
}
@keyframes pascalFloat{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
}


@media (max-width: 600px){
    body{
        min-height:100svh;
        overflow-x:hidden;
        overflow-y:auto;
        padding:18px 12px 40px;
        align-items:flex-start;
    }

    .card{
        width:100%;
        max-width:390px;
        padding:28px 20px;
        border-radius:26px;
        margin-top:18px;
    }

    .foto{
        width:130px;
        height:130px;
    }

    .titulo-area{
        gap:6px;
        margin-top:18px;
    }

    h1{
        font-size:48px;
    }

    .pascal{
        width:82px;
    }

    .pascal-fala{
        width:145px;
        font-size:11px;
        padding:8px 10px;
    }

    .sub,
    .texto{
        font-size:15px;
        line-height:1.6;
    }

    button{
        width:100%;
        padding:15px 20px;
    }

    #mensagem{
        font-size:17px;
        line-height:1.5;
    }
}

@media (max-width: 360px){
    h1{
        font-size:42px;
    }

    .pascal{
        width:70px;
    }
}

</style>
</head>
<body>

<div class="estrelas" id="estrelas"></div>

<div class="card">

<div class="foto">
<img src="https://beautiful-peach-g3wdjz9qqq.edgeone.app/IMG_4065.jpeg">
</div>


<div class="titulo-area">
    <h1>Isa</h1>

    <div class="pascal-container">
        <div class="pascal-fala" id="falaPascal">
            O Pascal apareceu ✨
        </div>

        <img 
        class="pascal"
        id="pascal"
        src="https://raw.githubusercontent.com/kaue-zip/imagem/refs/heads/main/ChatGPT%20Image%2027%20de%20mai.%20de%202026%2C%2011_14_03.png"
        alt="Pascal">
    </div>
</div>


<p class="sub">Você ilumina tudo igual as lanternas de Corona ✨</p>

<div class="linha"></div>

<p class="texto" id="digitando"></p>

<button onclick="mostrar()">Clique aqui ✨</button>

<div id="mensagem">
Você é literalmente a princesa mais linda desse reino 💜🏮
</div>

<div class="rodape">
feito com magia, lanternas e carinho 💜
</div>

</div>

<script>

const texto = "✨";
const area = document.getElementById("digitando");

let i = 0;

function escrever(){
    if(i < texto.length){
        area.innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever,45);
    }
}

escrever();

function mostrar(){
    document.getElementById("mensagem").style.display = "block";
    criarLanternas();
}

function criarLanternas(){
    for(let i=0;i<25;i++){

        setTimeout(()=>{

            const l = document.createElement("div");
            l.className = "lanterna";
            l.innerHTML = "🏮";

            l.style.left = Math.random()*100 + "vw";
            l.style.animationDuration = (5 + Math.random()*4) + "s";

            document.body.appendChild(l);

            setTimeout(()=>{
                l.remove();
            },9000);

        },i*150);

    }
}

for(let i=0;i<120;i++){

    const estrela = document.createElement("div");
    estrela.className = "estrela";

    estrela.style.left = Math.random()*100 + "vw";
    estrela.style.top = Math.random()*100 + "vh";

    estrela.style.animationDelay = Math.random()*3 + "s";

    document.getElementById("estrelas").appendChild(estrela);
}


window.addEventListener("DOMContentLoaded", () => {
    const pascal = document.getElementById("pascal");
    const falaPascal = document.getElementById("falaPascal");

    const frasesPascal = [
        "Rapunzel aprova esse site 💜",
        "Pascal achou isso mágico ✨",
        "Esse reino ficou lindo 🏮",
        "Você desbloqueou o modo Disney 👑",
        "As lanternas estão subindo ✨"
    ];

    pascal.addEventListener("click", ()=>{

        falaPascal.style.display = "block";

        falaPascal.innerHTML =
        frasesPascal[Math.floor(Math.random()*frasesPascal.length)];

        setTimeout(()=>{
            falaPascal.style.display = "none";
        },3000);

    });
});

</script>


</body>
</html>
