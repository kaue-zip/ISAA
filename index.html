<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isa 💖</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffd6e8;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      z-index: 2;
    }

    h1 {
      color: #ff4f9a;
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      color: #ff6fb0;
      font-size: 24px;
      margin: 10px 0;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #ff4f9a;
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(255, 79, 154, 0.4);
    }

    button:hover {
      background: #ff2f88;
    }

    #mensagem {
      margin-top: 25px;
      color: #ff006e;
      font-size: 28px;
      font-weight: bold;
      display: none;
    }

    .coracao {
      position: absolute;
      color: #ff4f9a;
      font-size: 30px;
      animation: cair 8s linear infinite;
    }

    @keyframes cair {
      from {
        transform: translateY(-100px);
        opacity: 1;
      }
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Isa 💖</h1>
    <p>💗 Isa 💗 Isa 💗 Isa 💗</p>
    <p>💕 Isa 💕 Isa 💕 Isa 💕</p>
    <button onclick="mostrarMensagem()">clique aqui</button>
    <div id="mensagem">otaria kkkkkkkkkkk</div>
  </div>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").style.display = "block";
    }

    const emojis = ["💖", "💕", "💗", "💘", "💝"];

    for (let i = 0; i < 35; i++) {
      const coracao = document.createElement("div");
      coracao.className = "coracao";
      coracao.textContent = emojis[Math.floor(Math.random() * emojis.length)] + " Isa";
      coracao.style.left = Math.random() * 100 + "vw";
      coracao.style.animationDelay = Math.random() * 8 + "s";
      coracao.style.fontSize = 20 + Math.random() * 25 + "px";
      document.body.appendChild(coracao);
    }
  </script>
</body>
</html>
