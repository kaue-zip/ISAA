<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Isa 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100svh;
    overflow-x:hidden;
    overflow-y:auto;
    touch-action:manipulation;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top, rgba(255,215,64,0.15), transparent 30%),
    linear-gradient(180deg,#1a1035,#2c145a,#4b1f7a);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    color:white;
    padding:20px 12px 50px;
}

.estrelas{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.estrela{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:piscar 2s infinite alternate;
}

@keyframes piscar{
    from{opacity:.2;}
    to{opacity:1;}
}

.card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;
    padding:28px 22px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,215,64,0.25);
}

.foto{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:50%;
    padding:6px;
    background:linear-gradient(135deg,#ffd54f,#fff3b0,#d4a017);
    box-shadow:0 0 30px rgba(255,215,64,.6);
}

.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #fff;
}

.titulo-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:18px;
}

h1{
    font-size:52px;
    color:#ffd54f;
    font-family:'Cinzel',serif;
    text-shadow:0 0 20px rgba(255,215,64,.7);
}

.pascal-container{
    position:relative;
}

.pascal{
    width:82px;
    cursor:pointer;
    animation:flutuarPascal 3s ease-in-out infinite;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 0 12px rgba(0,0,0,.35));
}

.pascal:hover{
    filter:drop-shadow(0 0 18px rgba(255,215,64,.75));
}

.pascal-fala{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    padding:8px 10px;
    border-radius:14px;
    background:rgba(255,255,255,.17);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.25);
    font-size:11px;
    display:none;
    z-index:50;
}

.pascal-andando{
    position:fixed;
    z-index:99998;
    width:78px;
    right:18px;
    bottom:88px;
    cursor:pointer;
    user-select:none;
    -webkit-user-drag:none;
    animation:pascalRespira 2.8s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(0,0,0,.45));
    transition:transform .35s ease, left .8s ease, top .8s ease, right .8s ease, bottom .8s ease;
}

.pascal-andando.escondido{
    transform:translateX(45px) rotate(-8deg);
}

.pascal-andando.dormindo{
    opacity:.88;
    transform:rotate(-5deg) scale(.95);
}

.pascal-balao{
    position:fixed;
    z-index:99999;
    right:74px;
    bottom:160px;
    width:160px;
    padding:10px 12px;
    border-radius:16px;
    background:rgba(255,255,255,.17);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.25);
    color:white;
    text-align:center;
    font-size:12px;
    display:none;
    box-shadow:0 0 18px rgba(255,215,64,.25);
}

@keyframes flutuarPascal{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
}

@keyframes pascalRespira{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-7px) rotate(2deg); }
}

.sub{
    margin-top:10px;
    font-size:15px;
    line-height:1.5;
    color:#f3d9ff;
}

.linha{
    width:90px;
    height:4px;
    margin:22px auto;
    border-radius:999px;
    background:linear-gradient(to right,#ffd54f,#c084fc);
}

.texto{
    font-size:15px;
    line-height:1.6;
}

button{
    width:100%;
    margin-top:18px;
    padding:15px 18px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#ffd54f,#ffca28);
    color:#4a148c;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,215,64,.5);
}

#mensagem{
    display:none;
    margin-top:22px;
    font-size:18px;
    color:#ffe082;
}

.rodape{
    margin-top:24px;
    font-size:13px;
    color:#e9d5ff;
}

.lanterna{
    position:fixed;
    bottom:-100px;
    font-size:22px;
    animation:subir linear forwards;
    opacity:.85;
}

@keyframes subir{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

.video-btn{
    position:fixed;
    left:12px;
    bottom:12px;
    z-index:9999;
    width:auto;
    padding:12px 15px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg,#ffd54f,#ffca28);
    color:#4a148c;
    font-weight:700;
    box-shadow:0 0 20px rgba(255,215,64,.5);
}


@media (max-width:600px){
    body{
        padding:14px 10px 95px;
        justify-content:center;
        align-items:flex-start;
    }

    .card{
        max-width:390px;
        min-height:auto;
        padding:24px 18px;
        border-radius:28px;
    }

    .foto{
        width:125px;
        height:125px;
    }

    h1{
        font-size:48px;
    }

    .sub,
    .texto{
        font-size:14px;
    }

    .linha{
        margin:18px auto;
    }

    button{
        min-height:48px;
    }

    .video-btn{
        left:50%;
        transform:translateX(-50%);
        bottom:10px;
        font-size:13px;
        padding:11px 16px;
        white-space:nowrap;
    }

    .pascal{
        width:72px;
    }

    .pascal-andando{
        width:68px;
        bottom:70px;
        right:10px;
    }

    .pascal-balao{
        right:58px;
        bottom:132px;
        width:145px;
        font-size:11px;
    }

    .lanterna{
        z-index:99999;
        pointer-events:none;
    }
}

@media (max-width:360px){
    .card{
        padding:22px 15px;
    }

    h1{
        font-size:42px;
    }

    .pascal{
        width:62px;
    }

    .pascal-andando{
        width:58px;
    }
}

</style>
</head>
<body>

<button class="video-btn" onclick="abrirVideo()">
🎵 Nossa música
</button>

<div class="estrelas" id="estrelas"></div>

<div class="card">

<div class="foto">
<img src="https://beautiful-peach-g3wdjz9qqq.edgeone.app/IMG_4065.jpeg">
</div>

<div class="titulo-area">

<h1>Isa</h1>

<div class="pascal-container">

<div class="pascal-fala" id="falaPascal">
Pascal aprovou esse site 💜
</div>

<img
class="pascal"
id="pascal"
src="https://raw.githubusercontent.com/kaue-zip/imagem/refs/heads/main/ChatGPT%20Image%2027%20de%20mai.%20de%202026%2C%2011_14_03.png"
alt="Pascal">

</div>

</div>

<p class="sub">
Você ilumina tudo igual as lanternas de Corona ✨
</p>

<div class="linha"></div>

<p class="texto" id="digitando"></p>

<button onclick="mostrar()">
Clique aqui ✨
</button>

<div id="mensagem">
Você é literalmente a princesa mais linda desse reino 💜🏮
</div>

<div class="rodape">
feito com magia, lanternas e carinho 💜
</div>

</div>

<script>

function abrirVideo(){
    window.open(
    "https://www.youtube.com/watch?v=vBy7FaapGRo&list=RDvBy7FaapGRo&start_radio=1",
    "_blank"
    );
}

const texto = "✨";
const area = document.getElementById("digitando");

let i = 0;

function escrever(){
    if(i < texto.length){
        area.innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever,45);
    }
}

escrever();

function mostrar(){

    document.getElementById("mensagem").style.display = "block";

    for(let i=0;i<22;i++){

        setTimeout(()=>{

            const l = document.createElement("div");

            l.className = "lanterna";
            l.innerHTML = "🏮";

            l.style.left = Math.random()*100 + "vw";
            l.style.animationDuration = (5 + Math.random()*4) + "s";

            document.body.appendChild(l);

            setTimeout(()=>{
                l.remove();
            },9000);

        },i*120);

    }
}

for(let i=0;i<70;i++){

    const estrela = document.createElement("div");

    estrela.className = "estrela";

    estrela.style.left = Math.random()*100 + "vw";
    estrela.style.top = Math.random()*100 + "vh";

    estrela.style.animationDelay = Math.random()*3 + "s";

    document.getElementById("estrelas").appendChild(estrela);
}

window.addEventListener("DOMContentLoaded",()=>{

    const pascal = document.getElementById("pascal");
    const fala = document.getElementById("falaPascal");
    const pascalAndando = document.getElementById("pascalAndando");
    const balaoAndando = document.getElementById("balaoPascalAndando");

    const frases = [
        "Rapunzel aprova 💜",
        "Esse reino ficou lindo ✨",
        "Pascal amou esse site 🏮",
        "Modo Disney ativado 👑"
    ];

    const frasesAndando = [
        "Me achou! 💜",
        "Vou passear pelo reino 🏮",
        "Cliquei e mudei de lugar ✨",
        "Estou protegendo a Isa 👑",
        "Esse site ficou mágico!"
    ];

    pascal.addEventListener("click",()=>{

        fala.style.display = "block";

        fala.innerHTML =
        frases[Math.floor(Math.random()*frases.length)];

        setTimeout(()=>{
            fala.style.display = "none";
        },3000);

    });

    function moverPascal(){
        const largura = window.innerWidth;
        const altura = window.innerHeight;

        const maxX = Math.max(10, largura - 95);
        const maxY = Math.max(80, altura - 180);

        const x = Math.floor(Math.random() * maxX);
        const y = Math.floor(90 + Math.random() * (maxY - 80));

        pascalAndando.style.left = x + "px";
        pascalAndando.style.top = y + "px";
        pascalAndando.style.right = "auto";
        pascalAndando.style.bottom = "auto";

        balaoAndando.style.left = Math.min(x + 20, largura - 170) + "px";
        balaoAndando.style.top = Math.max(20, y - 58) + "px";
        balaoAndando.style.right = "auto";
        balaoAndando.style.bottom = "auto";
    }

    function falarPascal(){
        balaoAndando.innerHTML =
        frasesAndando[Math.floor(Math.random()*frasesAndando.length)];

        balaoAndando.style.display = "block";

        setTimeout(()=>{
            balaoAndando.style.display = "none";
        },2500);
    }

    pascalAndando.addEventListener("click",()=>{
        falarPascal();
        moverPascal();
    });

    setInterval(()=>{
        moverPascal();
    },6500);

    setInterval(()=>{
        pascalAndando.classList.toggle("escondido");
    },4300);

});

</script>


<div class="pascal-balao" id="balaoPascalAndando">
    Me achou! 💜
</div>

<img
class="pascal-andando"
id="pascalAndando"
src="https://raw.githubusercontent.com/kaue-zip/imagem/refs/heads/main/ChatGPT%20Image%2027%20de%20mai.%20de%202026%2C%2011_14_03.png"
alt="Pascal andando">

</body>
</html>
